<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Aishah Zahirun</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      font-family: Arial, sans-serif;
      color: #f0f0f0;
    }
    .card {
      background-color: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      text-align: center;
      max-width: 350px;
    }
    .card h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #ffffff;
    }
    .card h2 {
      margin: 0.5rem 0;
      font-size: 1.2rem;
      color: #bbbbbb;
    }
    .skills {
      margin: 1rem 0;
    }
    .skills span {
      display: inline-block;
      background-color: #2a2a2a;
      padding: 0.4rem 0.8rem;
      margin: 0.2rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .fact {
      font-style: italic;
      color: #aaaaaa;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Aishah Zahirun</h1>
    <h2>Cloud Infrastructure Engineer</h2>
    <div class="skills">
      <span>IAM</span>
      <span>VDI</span>
    </div>
    <p class="fact">Suka stress tiba tiba</p>
  </div>
</body>
</html>
