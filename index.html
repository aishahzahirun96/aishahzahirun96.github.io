<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aishah Zahirun | Portfolio</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
        color: #f8fafc;
        padding: 20px;
    }

    .card {
        width: 100%;
        max-width: 420px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .avatar {
        width: 100px;
        height: 100px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
    }

    h1 {
        font-size: 1.9rem;
        margin-bottom: 8px;
    }

    .role {
        color: #94a3b8;
        margin-bottom: 24px;
    }

    .section-title {
        text-align: left;
        font-size: 0.9rem;
        color: #cbd5e1;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .skills {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }

    .skill {
        background: #334155;
        color: #e2e8f0;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 0.9rem;
    }

    .fact {
        text-align: left;
        background: #111827;
        border: 1px solid #374151;
        border-radius: 12px;
        padding: 16px;
        color: #d1d5db;
        line-height: 1.6;
    }
</style>
</head>
<body>

<div class="card">
    <div class="avatar">AZ</div>

    <h1>Aishah Zahirun</h1>
    <p class="role">Cloud Infrastructure Engineer</p>

    <div class="section-title">Kemahiran</div>
    <div class="skills">
        <span class="skill">IAM</span>
        <span class="skill">VDI</span>
    </div>

    <div class="section-title">Fakta Menarik</div>
    <div class="fact">
        Makin stress, makin suka travel
    </div>
</div>

</body>
</html>
